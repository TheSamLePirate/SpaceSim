<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:var(--font-sans);color:var(--foreground)}
html,body{margin:0}figure{margin:0}figcaption{font-weight:500;margin:0 0 14px} .note{color:var(--muted-foreground);margin:12px 0 0;font-size:12px}
.chart{display:grid;grid-template-columns:minmax(130px,1.6fr) repeat(4,minmax(56px,1fr));gap:0;align-items:stretch;font-size:14px}
.cell{padding:12px 5px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;overflow-wrap:anywhere}.label{justify-content:flex-start;text-align:left;padding-left:0}.heading{color:var(--muted-foreground);font-size:12px;font-weight:500}
.mark{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--chart-1)}.custom{background:var(--chart-2);border-radius:2px}.research{background:var(--chart-3);border-radius:0;transform:rotate(45deg);width:11px;height:11px}.blank{color:var(--muted-foreground)}
.sources{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px}.sources a{color:var(--foreground)}
@media(max-width:440px){.chart{grid-template-columns:minmax(104px,1.5fr) repeat(4,minmax(40px,1fr));font-size:12px}.heading{font-size:11px}.cell{padding-top:11px;padding-bottom:11px}}
</style></head><body><figure aria-label="Fonctions de FreeSpace Open classées selon le travail nécessaire pour SpaceSim">
